name: isaac
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.8
  - pip
  - setuptools
  - wheel
  - ninja
  - pytorch=1.8.1
  - torchvision=0.9.1
  - cudatoolkit=11.1
  - mkl=2022.1.0
  - numpy=1.24.4
  - scipy=1.10.1
  - pyyaml=6.0.2
  - tensorboard=2.17.1
  - typing_extensions
variables:
  VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/nvidia_icd.json

